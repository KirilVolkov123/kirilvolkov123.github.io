  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

wards; }\n  #om-pre .pre-word { font-family:'Inter Tight',sans-serif; font-weight:700; font-size:clamp(34px,6vw,52px); letter-spacing:-0.045em; color:#1f6fff; display:flex; align-items:baseline; animation:preWord 0.9s cubic-bezier(0.16,1,0.3,1) both; }\n  #om-pre .pre-dot { width:7px; height:7px; border-radius:50%; background:#1f6fff; margin-left:4px; animation:preDot 1.4s ease-in-out infinite; }\n  #om-pre .pre-track { position:relative; width:min(190px,44vw); height:2px; border-radius:2px; background:rgba(13,18,32,0.09); overflow:hidden; }\n  #om-pre .pre-fill { position:absolute; inset:0 auto 0 0; width:0; border-radius:2px; background:linear-gradient(90deg,#2f9bff,#1f6fff); animation:preFill 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }\n  @keyframes preWord { from { opacity:0; transform:translateY(14px); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }\n  @keyframes preDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.7); } }\n  @keyframes preFill { 0% { width:0; } 55% { width:62%; } 100% { width:100%; } }\n  @keyframes preOut { to { opacity:0; visibility:hidden; transform:scale(1.04); } }\n  @keyframes fadeUp { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:translateY(0); } }\n  @keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }\n  @keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.45; transform:scale(0.82); } }\n  @keyframes sheen { 0% { transform:translateX(-160%) skewX(-20deg); } 100% { transform:translateX(260%) skewX(-20deg); } }\n  @keyframes floatA { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }\n  @keyframes floatB { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-22px); } }\n  @keyframes floatC { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }\n  @keyframes blink { 0%,80%,100% { opacity:0.25; } 40% { opacity:1; } }\n  .hchip { di portant; }\n    .modal-head { padding:20px 20px 14px !important; }\n    .modal-body { padding:20px 20px 26px !important; }\n    .modal-grid { gap:12px !important; }\n    .modal-body .modal-grid > div { padding:18px 18px !important; }\n    .ct-row { padding:18px 18px !important; }\n  }\n\n  /* 4. iOS \u0437\u0431\u0456\u043b\u044c\u0448\u0443\u0454 \u0441\u0442\u043e\u0440\u0456\u043d\u043a\u0443, \u044f\u043a\u0449\u043e \u043f\u043e\u043b\u0435 \u0434\u0440\u0456\u0431\u043d\u0456\u0448\u0435 \u0437\u0430 16px \u2014 \u0442\u0440\u0438\u043c\u0430\u0454\u043c\u043e 16 */\n  @media (max-width:900px) {\n    .f-input, input, textarea, select { font-size:16px !important; }\n  }\n\n\n  /* \u2500\u2500 \u0424\u043e\u0440\u043c\u0430 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     \u041f\u043e\u043b\u044f \u0431\u0443\u043b\u0438 \u043f\u043b\u0430\u0441\u043a\u0438\u043c\u0438 \u043f\u0440\u044f\u043c\u043e\u043a\u0443\u0442\u043d\u0438\u043a\u0430\u043c\u0438; \u0442\u0435\u043f\u0435\u0440 \u043c\u02bc\u044f\u043a\u0430 \u043f\u0456\u0434\u043a\u043b\u0430\u0434\u043a\u0430,\n     \u0432\u0438\u0434\u0438\u043c\u0438\u0439 \u0444\u043e\u043a\u0443\u0441 \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u043f\u043e\u0432\u0456\u0442\u0440\u044f \u043c\u0456\u0436 \u0440\u044f\u0434\u043a\u0430\u043c\u0438. */\n  .form-sky { position:absolute; left:0; right:0; bottom:0; width:100%; height:56%;\n    z-index:0; pointer-events:none; display:block; }\n  .form-side > *:not(.form-sky) { position:relative; z-index:1; }\n  .f-label { display:block; font-size:12.5px; font-weight:600; color:#6b7490;\n    margin-bottom:9px; letter-spacing:-0.005em; }\n  .f-input { width:100%; box-sizing:border-box; padding:16px 18px; border-radius:16px;\n    border:1px solid rgba(13,18,32,0.09); background:#f7f9fd; font-size:15px; color:#0d1220;\n    font-family:inherit; transition:border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;\n    box-shadow:inset 0 1px 2px rgba(13,18,32,0.03); }\n  .f-input::placeholder { color:#a8b0c2; }\n  .f-input:hover { border-color:rgba(13,18,32,0.16); }\n  .f-input:focus { outline:none; background:#fff; border-color:#1f6fff;\n    box-shadow:0 0 0 4px rgba(31,111,255,0.12); }\n  .modal-sheet { border-radius:34px !important;\n    box-shadow:0 2px 6px rgba(13,18,32,0.06),\n               0 30px 70px -30px rgba(13,18,32,0.35),\n               0 80px 160px -60px rgba(13,18,32,0.5) !important; }\n\n  /* \u2500\u2500 \u041a\u043e\u043d\u0442\u0430\u043a\u0442\u0438: \u0440\u0435\u0434\u0430\u043a\u0446\u0456\u0439\u043d\u0430 \u0440\u043e\u0437\u043a\u043b\u0430\u0434\u043a\u0430 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     \u0417\u0430\u043c\u0456\u0441\u0442\u044c \u0440\u0432\u0430\u043d\u043e\u0457 \u0441\u0456\u0442\u043a\u0438 \u0437 \u0432\u0435\u043b\u0438\u043a\u043e\u044e \u0441\u0438\u043d\u044c\u043e\u044e \u043f\u043b\u0430\u0448\u043a\u043e\u044e \u2014 \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u043b\u0456\u0432\u043e\u0440\u0443\u0447\n     \u0456 \u043e\u0434\u043d\u0430 \u043f\u0430\u043d\u0435\u043b\u044c \u043f\u0440\u0430\u0432\u043e\u0440\u0443\u0447, \u0440\u044f\u0434\u043a\u0438 \u0440\u043e\u0437\u0434\u0456\u043b\u0435\u043d\u0456 \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u043e\u044e \u043b\u0456\u043d\u0456\u0454\u044e. */\n  .contacts-wrap { display:grid; grid-template-columns:0.78fr 1.22fr; gap:64px; align-items:start; }\n  .contacts-sub { margin:22px 0 0; font-size:15.5px; line-height:1.7; color:#4b5470; max-width:330px; }\n  .contacts-panel { background:#fff; border-radius:28px; overflow:hidden;\n    border:1px solid rgba(13,18,32,0.055);\n    box-shadow:0 1px 2px rgba(13,18,32,0.03),\n               0 14px 32px -14px rgba(13,18,32,0.14),\n               0 44px 80px -40px rgba(13,18,32,0.28); }\n  .ct-row { display:flex; align-items:center; gap:18px; padding:22px 28px;\n    border-top:1px solid rgba(13,18,32,0.05); transition:background 0.25s ease; }\n  .ct-row:first-child { border-top:none; }\n  .ct-row:hover { background:rgba(31,111,255,0.035); }\n  .ct-row-hero { background:linear-gradient(100deg, rgba(34,158,217,0.09), rgba(34,158,217,0.02)); }\n  .ct-row-hero:hover { background:linear-gradient(100deg, rgba(34,158,217,0.14), rgba(34,158,217,0.04)); }\n  .ct-ico { width:46px; height:46px; border-radius:15px; flex-shrink:0; display:grid; place-items:center;\n    background:rgba(13,18,32,0.045); color:#39415a; font-size:21px; transition:all 0.25s ease; }\n  .ct-row:hover .ct-ico { background:rgba(31,111,255,0.1); color:#1f6fff; }\n  .ct-ico-tg { background:rgba(34,158,217,0.14) !important; color:#229ED9 !important; }\n  .ct-body { flex:1; min-width:0; }\n  .ct-label { display:flex; align-items:center; gap:9px; font-size:10.5px; font-weight:600;\n    letter-spacing:0.2em; text-transform:uppercase; color:#98a1b6; }\n  .ct-pill { font-size:9.5px; letter-spacing:0.12em; padding:3px 9px; border-radius:999px;\n    background:rgba(34,158,217,0.14); color:#1b7fae; }\n  .ct-value { display:block; font-family:'Inter Tight',sans-serif; font-size:18.5px; font-weight:600;\n    letter-spacing:-0.018em; color:#0d1220; margin-top:6px; overflow-wrap:anywhere; }\n  .ct-hint { display:block; font-size:13px; color:#6b7490; margin-top:3px; }\n  .ct-arrow { font-size:17px; color:#c2c8d6; flex-shrink:0; transition:all 0.25s ease; }\n  .ct-row:hover .ct-arrow { color:#1f6fff; transform:translate(2px,-2px); }\n  @media (max-width:900px) { .contacts-wrap { grid-template-columns:1fr; gap:34px; }\n    .contacts-sub { max-width:none; } }\n\n  /* \u0422\u0438\u043f\u043e\u0433\u0440\u0430\u0444\u0456\u043a\u0430 */\n  .h2big { font-size:clamp(34px, 5.2vw, 60px) !important; letter-spacing:-0.04em !important; line-height:1.02 !important; }\n  .eyebrow { margin-bottom:18px; }\n  .eyebrow > span:last-child { letter-spacing:0.22em !important; font-size:11.5px !important; }\n\n  /* \u0421\u043c\u0443\u0433\u0430 \u0441\u0442\u0435\u043a\u0430: \u0431\u0443\u043b\u0430 \u0432\u0443\u0437\u044c\u043a\u043e\u044e \u0447\u043e\u0440\u043d\u043e\u044e \u043f\u043b\u0430\u0448\u043a\u043e\u044e \u2014 \u0442\u0435\u043f\u0435\u0440 \u0433\u043b\u0438\u0431\u043e\u043a\u0435 \u043d\u0456\u0447\u043d\u0435 \u043d\u0435\u0431\u043e */\n  .band-stack { background:linear-gradient(180deg,#121b30 0%,#18233d 45%,#111a2e 100%) !important; padding-top:150px !important; }\n  .band-stack > div { padding-bottom:150px !important; }\n  .band-stack::after {\n    background:\n      radial-gradient(70% 60% at 50% -18%, rgba(140,180,255,0.26), transparent 62%),\n      radial-gradient(40% 24% at 12% 96%, rgba(180,205,255,0.10), transparent 70%),\n      radial-gradient(42% 24% at 88% 96%, rgba(180,205,255,0.09), transparent 70%) !important;\n  }\n  .stack-head { color:rgba(255,255,255,0.5) !important; font-size:12.5px !important; letter-spacing:0.24em !important; margin-bottom:38px !important; }\n  .stack-chip { padding:15px 32px !important; font-size:16px !important;\n    background:rgba(255,255,255,0.05) !important; border:1px solid rgba(255,255,255,0.11) !important;\n    color:rgba(255,255,255,0.88) !important; }\n\n  /* \u041f\u0456\u0434\u0432\u0430\u043b: \u0440\u0456\u0432\u043d\u0456 \u043f\u0440\u043e\u043c\u0456\u0436\u043a\u0438 \u0439 \u0432\u043e\u043b\u043e\u0441\u044f\u043d\u0430 \u043b\u0456\u043d\u0456\u044f \u0437\u0430\u043c\u0456\u0441\u0442\u044c \u00ab\u043f\u043b\u0430\u0432\u0430\u044e\u0447\u0438\u0445\u00bb \u0440\u044f\u0434\u043a\u0456\u0432 */\n  .foot-links { display:flex; align-items:center; justify-conte 43b \u043f\u043e \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0438\u0445 \u0456 10 \u043e\u043a\u0440\u0435\u043c\u0438\u0445 KPI. Airtable \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u0454 \u043b\u0438\u0448\u0435 \u0430\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u0456 \u0437\u0430\u043f\u0438\u0441\u0438, \u0456\u0441\u0442\u043e\u0440\u0456\u0457 \u043d\u0435\u043c\u0430\u0454.', result: '\u0414\u0432\u0456 \u043d\u0435\u0437\u0430\u043b\u0435\u0436\u043d\u0456 \u0441\u0438\u0441\u0442\u0435\u043c\u0438 \u0437\u0432\u0456\u0442\u043d\u043e\u0441\u0442\u0456: \u043e\u0434\u043d\u0430 \u043f\u043e\u043a\u0430\u0437\u0443\u0454 \u0437\u0430\u043b\u0438\u0448\u043a\u0438 \u043f\u043e \u0441\u0442\u0430\u0442\u0443\u0441\u0430\u0445 \u043d\u0430 \u043a\u0456\u043d\u0435\u0446\u044c \u043a\u043e\u0436\u043d\u043e\u0433\u043e \u0434\u043d\u044f, \u0434\u0440\u0443\u0433\u0430 \u2014 \u0440\u0443\u0445 \u043d\u043e\u0432\u0438\u0445 \u043b\u044e\u0434\u0435\u0439 \u043f\u043e 10 KPI. \u0412\u043b\u0430\u0441\u043d\u0438\u043a \u0431\u0430\u0447\u0438\u0442\u044c \u0434\u0438\u043d\u0430\u043c\u0456\u043a\u0443 \u0432 \u0433\u0440\u0430\u0444\u0456\u043a\u0430\u0445 \u0456 pivot-\u0442\u0430\u0431\u043b\u0438\u0446\u044f\u0445 \u0456\u0437 \u0444\u0456\u043b\u044c\u0442\u0440\u0430\u043c\u0438 \u043f\u043e \u0434\u0430\u0442\u0456, \u0441\u0442\u0430\u0442\u0443\u0441\u0443 \u0439 \u043c\u0435\u043d\u0435\u0434\u0436\u0435\u0440\u0443.', steps: [ { name: '\u0429\u043e\u0434\u0435\u043d\u043d\u0456 snapshot-\u0437\u0440\u0456\u0437\u0438', desc: 'Automation \u0449\u043e\u0432\u0435\u0447\u043e\u0440\u0430 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u0454 \u043a\u0456\u043b\u044c\u043a\u0456\u0441\u0442\u044c \u0441\u043f\u0440\u0430\u0432 \u043f\u043e \u0441\u0442\u0430\u0442\u0443\u0441\u0430\u0445 \u0456 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0438\u0445.' }, { name: 'Pre-check \u043c\u0435\u043d\u0435\u0434\u0436\u0435\u0440\u0456\u0432', desc: '\u041f\u0435\u0440\u0435\u0434 \u0437\u0440\u0456\u0437\u043e\u043c Make \u0447\u0435\u0440\u0435\u0437 Airtable API \u0434\u043e\u0434\u0430\u0454 \u043d\u043e\u0432\u0438\u0445 \u043c\u0435\u043d\u0435\u0434\u0436\u0435\u0440\u0456\u0432 \u0443 Single select, \u0449\u043e\u0431 \u0441\u043a\u0440\u0438\u043f\u0442 \u043d\u0435 \u043f\u0430\u0434\u0430\u0432.' }, { name: '\u0414\u0440\u0443\u0433\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u2014 KPI', desc: '\u041e\u043a\u0440\u0435\u043c\u0430 \u0442\u0430\u0431\u043b\u0438\u0446\u044f \u0440\u0430\u0445\u0443\u0454 10 KPI: \u043f\u043e\u0440\u0456\u0432\u043d\u044e\u0454 record IDs \u0437\u0430 \u0434\u043d\u0456 \u0439 \u0432\u0438\u0437\u043d\u0430\u0447\u0430\u0454 \u0441\u0430\u043c\u0435 \u043d\u043e\u0432\u0438\u0445 \u043b\u044e\u0434\u0435\u0439.' }, { name: '\u0414\u0430\u0448\u0431\u043e\u0440\u0434\u0438 \u0432 Interface', desc: 'Line chart \u0456 pivot \u043f\u043e \u0441\u0442\u0430\u0442\u0443\u0441\u0430\u0445, \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0438\u0445 \u0456 KPI \u0437 \u0444\u0456\u043b\u044c\u0442\u0440\u0430\u043c\u0438 \u043f\u043e \u043f\u0435\u0440\u0456\u043e\u0434\u0443.' } ], stack: ['Airtable', 'Airtable Scripting', 'Make', 'Airtable API', 'Analytics'], imgs: ['assets/case-report1.png', 'assets/case-report2.png', 'assets/case-report3.png', 'assets/case-report4.png'] },\n    ],\n    en: [\n      { name: 'Currency exchange service in Vietnam', tag: 'Bot + admin panel', desc: 'The owner took requests in chats and calculated rates by hand.', task: 'The exchange owner ran requests manually in chats: rates were in his head, requests got lost, support took all day.', result: 'A client completes an exchange in a minute without the owner. All requests, rates and stats \u2014 in one panel. Support fully in Telegram.', steps: [ { name: 'Process audit', desc: 'Mapped how a request flows from client to cash.' }, { name: 'Telegram bot for clients', desc: 'Rate, calculator, request and confirmation \u2014 all in the bot.' }, { name: 'Owner admin panel', desc: 'Rates, request flow, statuses and stats in one window.' }, { name: 'Launch & onboarding', desc: 'Moved support to Telegram, trained the owner.' } ], stack: ['Python', 'Telegram Bot API', 'Admin panel', 'Webhooks'] },\n      { name: 'MANNA \u2014 language learning app', tag: 'Own product', desc: 'Flashcards, AI chat and voice practice in one Telegram app.', task: 'Learners usually have to choose between drilling flashcards and actually speaking: vocabulary grows in one app, conversation is practised in another, and neither makes you come back daily.', result: 'Runs inside Telegram \u2014 nothing to install. Card sets with four training modes, an AI chat that corrects mistakes right in the conversation, and voice practice. The product is in development \u2014 some features are still being finished, but it is already testable.', steps: [ { name: 'Cards and modes', desc: 'Classic flip, quiz, pair matching and dictation with AI checking.' }, { name: 'AI chat', desc: 'The partner highlights mistakes inline, so there is no separate error review.' }, { name: 'Voice mode', desc: 'Speaking practice out loud \u2014 to move words out of passive vocabulary.' }, { name: 'Progress and habit', desc: 'Day streaks, weekly analytics and reminders in Telegram.' } ], stack: ['Telegram Mini App', 'AI / LLM', 'Voice', 'Payments'], imgs: ['assets/case-manna-1.png', 'assets/case-manna-2.png', 'assets/case-manna-3.png', 'assets/case-manna-4.png', 'assets/case-manna-5.png', 'assets/case-manna-6.png', 'assets/case-manna-7.png', 'assets/case-manna-8.png'], phone: true, wip: true, tryUrl: 'https://t.me/manna_mobi_bot' },\n      { name: 'YouTube media pipeline', tag: 'Content automation', desc: 'The team manually published dozens of videos daily.', task: '40-60 videos had to go out daily across 7 YouTube channels. The team spent whole working days on it.', result: '40-60 videos a day go out on 7 channels fully hands-off. The team only drops files on a drive.', steps: [ { name: 'Source: drive', desc: 'The system picks up new videos as they appear.' }, { name: 'AI metadata', desc: 'Titles, descriptions and tags generated per channel.' }, { name: 'Smart schedule', desc: 'Videos distributed across 7 channels by time.' }, { name: 'Publish & monitor', desc: 'Auto-upload via API, statuses in a sheet.' } ], stack: ['Make', 'YouTube API', 'GPT', 'Google Drive'], imgs: ['assets/case-youtube.png', 'assets/case-youtube2.png'] },\n      { name: 'Dropshipping pipeline', tag: 'AI + content', desc: 'Product cards and social posting took a full day.', task: 'Filling product cards and posting to social networks by hand ate the whole day and didn\\u2019t scale.', result: 'A product is uploaded once \u2014 the system does the rest: cards, sheets, posts on 4 platforms on schedule.', steps: [ { name: 'Product upload', desc: 'One entry point for new products \u2014 the pipeline takes over.' }, { name: 'GPT card processing', desc: 'Descriptions, prices and categories generated automatically.' }, { name: 'Data in sheets', desc: 'The catalog is kept without manual copying.' }, { name: 'Auto-posting', desc: 'Instagram, TikTok, YouTube and Telegram on schedule.' } ], stack: ['Make', 'GPT', 'Google Sheets', 'Social APIs'], imgs: ['assets/case-dropship.png'] },\n      { name: 'Telegram channel monitoring', tag: 'AI analysis', desc: 'A person re-read dozens of channels daily looking for what mattered.', task: 'The client needed to not miss relevant posts across dozens of Telegram channels, but reading everything daily was unrealistic.', result: 'Instead of hours of reading \u2014 a ready personalized selection of only relevant posts.', steps: [ { name: 'Post collection', desc: 'The system gathers new posts from all needed channels.' }, { name: 'AI filtering', desc: 'GPT scores each post by relevance criteria.' }, { name: 'Personalized feed', desc: 'Only what truly concerns the client.' } ], stack: ['Python', 'Telegram API', 'GPT'] },\n      { name: 'KeyCRM \u2192 Airtable sync', tag: 'Integration', desc: 'Leads were moved between systems by hand and some got lost.', task: 'The team kept leads in KeyCRM but worked in Airtable. Manual transfer meant delays and lost leads.', result: 'Every lead appears in Airtable instantly and in the right format. Zero manual copying.', steps: [ { name: 'KeyCRM webhooks', desc: 'Every new lead and status change is caught instantly.' }, { name: 'Data mapping', desc: 'Fields are converted to Airtable format without loss.' }, { name: 'Write & control', desc: 'Auto-write with duplicate and error checks.' } ], stack: ['Make', 'KeyCRM API', 'Airtable API', 'Webhooks'], imgs: ['assets/case-airtable.png'] },\n      { name: 'PDF contract generation in KeyCRM', tag: 'CRM automation', desc: 'Managers built contracts by hand, copy-pasting data from the CRM.', task: 'Every contract was assembled manually: the manager copied client data from the CRM into a template and fixed numbers and dates \u2014 slow and error-prone.', result: 'A ready-to-use PDF contract is generated from a KeyCRM lead in one click: client details, number, date, services and signatures fill themselves in, preserving the original document structure.', steps: [ { name: 'Template inside KeyCRM', desc: 'Contract laid out in HTML/CSS within the CRM.' }, { name: 'Twig variables & loops', desc: 'Lead data fills in automatically, services via a loop.' }, { name: 'PDF formatting', desc: 'Tables, signatures and formatting like the original.' }, { name: 'Generate from a lead', desc: 'Managers get a finished document with zero copy-paste.' } ], stack: ['HTML', 'CSS', 'Twig', 'PDF', 'CRM'], imgs: ['assets/case-contract.png'] },\n      { name: 'Payment gateway integration (WayForPay)', tag: 'Payments', desc: 'The site needed to accept secure online payments.', task: 'A live website needed secure online payments with correct status tracking and post-payment actions.', result: 'Clients pay on the site, transaction status is captured automatically, and post-payment actions fire \u2014 reliable, with no manual checking.', steps: [ { name: 'Payment form', desc: 'WayForPay integrated into the site checkout.' }, { name: 'Transaction handling', desc: 'Proper validation and site-to-provider connection.' }, { name: 'Status webhooks', desc: 'Payment status captured, triggering post-payment actions.' } ], stack: ['WayForPay', 'API', 'Python', 'Webhooks'], imgs: ['assets/case-wayforpay.png'] },\n      { name: 'Historical reporting in Airtable', tag: 'Analytics + KPI', desc: 'Airtable only shows the current state and keeps no daily history.', task: 'The owner needed to see dynamics, not a snapshot: how many people sit in each status per day, the split by responsible manager, and 10 separate KPIs. Airtable stores only current records \u2014 there is no history.', result: 'Two independent reporting systems: one shows status balances at the end of each day, the other tracks new people across 10 KPIs. The owner sees dynamics in charts and pivot tables with filters by date, status and manager.', steps: [ { name: 'Daily snapshots', desc: 'An automation stores case counts by status and responsible each evening.' }, { name: 'Manager pre-check', desc: 'Before the snapshot, Make adds new managers to the Single select via the Airtable API so the script never breaks.' }, { name: 'Second system \u2014 KPIs', desc: 'A separate table computes 10 KPIs: it compares record IDs across days to find genuinely new people.' }, { name: 'Interface dashboards', desc: 'Line charts and pivots by status, responsible and KPI with period filters.' } ], stack: ['Airtable', 'Airtable Scripting', 'Make', 'Airtable API', 'Analytics'], imgs: ['assets/case-report1.png', 'assets/case-report2.png', 'assets/case-report3.png', 'assets/case-report4.png'] },\n    ],\n    pl: [\n      { name: 'Serwis wymiany walut w Wietnamie', tag: 'Bot + panel ad
